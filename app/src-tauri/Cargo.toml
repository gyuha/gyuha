[package]
name = "gyuha-commander"
version = "0.1.0"
description = "Cross-platform dual-pane file manager"
edition = "2021"
rust-version = "1.77"

[lib]
name = "gyuha_commander_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
notify = "6"
trash = "5"
fs_extra = "1.3"
opener = "0.7"
sysinfo = "0.33"
dirs = "5"
